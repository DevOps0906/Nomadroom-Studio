[project]
name = "nomadroom-api"
version = "0.1.0"
description = "Nomadroom Studio API (FastAPI): Supabase JWT 검증·워커 토큰 인증"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: 로컬 supabase start 실제 토큰이 필요한 테스트"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
